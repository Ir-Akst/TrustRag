[project]
name = "trustrag"
version = "0.1.0"
description = "TrustRAG Phase 00 foundation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.urls]
Homepage = "https://example.com/trustrag"

[project.scripts]
trustrag-data = "trustrag.data.cli:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["trustrag"]

[tool.setuptools.package-data]
"*" = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests requiring deliberate invocation (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not integration'"

[dependency-groups]
core = [
    "numpy",
    "pandas",
    "scipy",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "python-dotenv",
    "tqdm",
    "requests",
    "httpx",
    "tenacity",
]
ml = [
    "torch",
    "transformers",
    "datasets>=2.15,<3",
    "sentence-transformers",
    "accelerate",
    "tokenizers",
    "scikit-learn",
    "xgboost",
    "joblib",
    "faiss-cpu",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
    "ipykernel",
]
api = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]
experiment = [
    "mlflow",
    "matplotlib",
    "plotly",
]
optional-llm = [
    "openai",
    "google-genai",
    "anthropic",
]
